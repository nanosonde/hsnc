# Mock network devices for hsnc.
#
# Brings up two device simulators that the real device drivers can target on two
# independent planes: SSH for configuration, and a non-SSH transport for
# monitoring (Prometheus for OpenWrt, SNMPv3 for JetStream).
#
#   mock-openwrt    OpenWrt router/AP  -> ssh -p 2201 root@localhost   (pw: openwrt)
#                                      -> http://localhost:9100/metrics (Prometheus)
#   mock-jetstream  JetStream switch   -> ssh -p 2202 admin@localhost  (pw: admin)
#                                      -> snmp udp://localhost:1161     (SNMPv3)
#
# Usage:
#   docker compose -f fakes/docker-compose.yml up -d --build
#   docker compose -f fakes/docker-compose.yml down            # keep state volumes
#   docker compose -f fakes/docker-compose.yml down -v         # wipe state volumes

services:
  mock-openwrt:
    build: ./openwrt
    image: hsnc/mock-openwrt
    container_name: mock-openwrt
    hostname: mock-openwrt
    ports:
      - "2201:22"       # configuration plane (SSH)
      - "9100:9100"     # monitoring plane (Prometheus exporter)
    environment:
      MOCK_SSH_USER: root
      MOCK_SSH_PASSWORD: ${MOCK_OPENWRT_PASSWORD:-openwrt}
      MOCK_MODEL: "TP-Link ER605 (mock)"
      MOCK_BOARD: "tplink,er605"
      # MOCK_PROMETHEUS_TOKEN: ""   # set to require a bearer token on /metrics
      # MOCK_SSH_PUBKEY: "ssh-ed25519 AAAA... user@host"
    volumes:
      - openwrt-state:/var/lib/mockdev
    networks:
      mocknet:
        ipv4_address: 172.28.0.11

  mock-jetstream:
    build: ./jetstream
    image: hsnc/mock-jetstream
    container_name: mock-jetstream
    hostname: mock-jetstream
    ports:
      - "2202:22"          # configuration plane (SSH)
      - "1161:161/udp"     # monitoring plane (SNMPv3)
    environment:
      MOCK_SSH_USER: admin
      MOCK_SSH_PASSWORD: ${MOCK_JETSTREAM_PASSWORD:-admin}
      MOCK_MODEL: "TL-SG2210P"
      MOCK_MAC: "00-11-22-33-44-02"
      # SNMPv3 USM credentials the controller must match (HSNC_SNMP_*).
      MOCK_SNMP_USER: ${MOCK_SNMP_USER:-hsncmon}
      MOCK_SNMP_AUTH_KEY: ${MOCK_SNMP_AUTH_KEY:-hsncauth123}
      MOCK_SNMP_PRIV_KEY: ${MOCK_SNMP_PRIV_KEY:-hsncpriv123}
      # MOCK_SSH_PUBKEY: "ssh-ed25519 AAAA... user@host"
    volumes:
      - jetstream-state:/var/lib/mockdev
    networks:
      mocknet:
        ipv4_address: 172.28.0.12

  # Optional: run hsnc against the mocks (HSNC_USE_MOCK_DEVICES=0) so the
  # real SSH adapters drive the simulators over the network instead of using the
  # in-process mock adapter. Enable with:  --profile controller
  controller:
    profiles: ["controller"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: hsnc/controller
    container_name: hsnc-controller
    depends_on:
      - mock-openwrt
      - mock-jetstream
    environment:
      HSNC_SECRET_KEY: dev-secret-change-me
      HSNC_USE_MOCK_DEVICES: "0"
      # Configuration plane (SSH): passwords match the mock defaults.
      HSNC_OPENWRT_SSH_PASSWORD: ${MOCK_OPENWRT_PASSWORD:-openwrt}
      HSNC_JETSTREAM_SSH_PASSWORD: ${MOCK_JETSTREAM_PASSWORD:-admin}
      # Monitoring plane (non-SSH): match the mock SNMPv3 USM credentials so the
      # JetStreamSnmpMonitoringProvider can poll mock-jetstream. The OpenWrt
      # Prometheus exporter needs no token by default.
      HSNC_SNMP_USER: ${MOCK_SNMP_USER:-hsncmon}
      HSNC_SNMP_AUTH_KEY: ${MOCK_SNMP_AUTH_KEY:-hsncauth123}
      HSNC_SNMP_PRIV_KEY: ${MOCK_SNMP_PRIV_KEY:-hsncpriv123}
    volumes:
      # Inventory pointing at the mock hostnames (both planes). Real-device mode
      # refuses to start without it.
      - ./devices.yaml:/data/config/devices.yaml:ro
    ports:
      # Host 8088 (8080 is often taken by a real-device controller); UI lives here.
      - "8088:8080"
    networks:
      - mocknet

volumes:
  openwrt-state:
  jetstream-state:

networks:
  mocknet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
