        pvid: 1
      - number: 7
        name: ""
        enabled: false
        mode: access
        pvid: 1
      - number: 8
        name: ""
        enabled: false
        mode: access
        pvid: 1

  - id: ap-1
    name: EAP245
    kind: access_point
    mac: "10:27:F5:00:00:20"
