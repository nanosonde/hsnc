{% extends "base.html" %}
{% block title %}{{ code }} · openwrt-manager-ui{% endblock %}
{% block content %}
<div class="card card-pad" style="text-align:center; padding:48px">
  <h1 style="font-size:42px; margin:0">{{ code }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Back to Dashboard</a>
</div>
{% endblock %}
{% block guest %}
<div class="login-wrap">
  <div class="card card-pad" style="text-align:center; width:360px">
    <h1 style="font-size:42px; margin:0">{{ code }}</h1>
    <p class="muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Sign In</a>
  </div>
</div>
{% endblock %}
