services:
  controller:
    build: .
    image: hsnc:latest
    container_name: hsnc
    ports:
      - "8080:8080"
    environment:
      # Change this to a strong random value in production.
      HSNC_SECRET_KEY: "change-me-in-production"
      # Real devices. The container will refuse to start unless you provide your
      # own config/devices.yaml (mounted below). For a hardware-free demo, build
      # the image and run it with HSNC_USE_MOCK_DEVICES=1 instead.
      HSNC_USE_MOCK_DEVICES: "0"
      HSNC_POLL_INTERVAL: "30"
      HSNC_RETENTION_DAYS: "30"
      # Application log verbosity: debug, info, warning, error, critical.
      HSNC_LOG_LEVEL: "info"
      # Optional SSH debugging (off by default). Globals shown; per-device variants
      # HSNC_DEVICE_<ID>_SSH_DEBUG / HSNC_DEVICE_<ID>_SSH_TRANSCRIPT_DEBUG override
      # them. WARNING: enabling these can write device secrets to the logs.
      # HSNC_SSH_TRANSCRIPT_DEBUG: "0"
      # HSNC_SSH_DEBUG: "0"
      # On startup the REST backend reads each device's live config as the
      # history baseline. Set to "0" if the controller is the sole source of
      # truth and devices are never changed out-of-band.
      HSNC_BASELINE_ON_START: "1"
    # SSH passwords are read from the environment, never from devices.yaml.
    # Put them in a git-ignored .env file next to this compose file. Copy the
    # template and fill it in:
    #   cp .env.example .env
    # e.g.:
    #   HSNC_OPENWRT_SSH_PASSWORD=...
    #   HSNC_JETSTREAM_SSH_PASSWORD=...
    # Monitoring transport (per platform, never SSH): OpenWrt gateways/APs poll
    # over Prometheus, JetStream switches over SNMPv3. Put the tokens/keys in the
    # same .env file, e.g.:
    #   HSNC_PROMETHEUS_TOKEN=...            # OpenWrt exporter bearer token
    #   HSNC_SNMP_USER=hsncmon               # SNMPv3 USM user (needs [snmp] extra)
    #   HSNC_SNMP_AUTH_KEY=...               # SNMPv3 auth password
    #   HSNC_SNMP_PRIV_KEY=...               # SNMPv3 privacy password
    # See docs/devices/ and .env.example for the full list.
    # Compose loads .env for ${VAR} interpolation, but only env_file injects the
    # values into the container's environment where the app actually reads them.
    env_file:
      - path: .env
        required: false
    volumes:
      - controller-data:/data
      # Your device inventory (connection profiles only). Create it first:
      #   cp config/devices.yaml.example config/devices.yaml   # then edit
      # The container fails fast if this file is missing.
      - ./config/devices.yaml:/data/config/devices.yaml:ro
    restart: unless-stopped

volumes:
  controller-data:
