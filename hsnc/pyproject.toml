[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsnc"
version = "0.1.0"
description = "REST backend for hsnc, a self-hosted home & small-network controller: device I/O, polling and persistence for OpenWrt gateways/APs and JetStream switches."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "hsnc contributors" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "Flask>=3.0",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "Werkzeug>=3.0",
    "click>=8.1",
    "gunicorn>=21.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
ssh = [
    "paramiko>=3.4",
]

[project.scripts]
hsnc-ctl = "hsnc.backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
